<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123832">
<title>অর্ডার করুন — SOHAN SHOP BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#1B2420; --paper:#F1F3EC; --paper-deep:#E7EADD;
    --green-900:#0F3830; --green-800:#123832; --green-700:#1F5C4F; --green-600:#2E7D5B;
    --gold:#B8863E; --gold-light:#D9AF6B; --gold-bright:#E0AC53;
    --muted:#6B7268; --card:#FFFFFF; --rule:rgba(15,56,48,0.10);
    --shadow: 0 8px 24px rgba(15,40,34,0.10);
    --radius: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Hind Siliguri','IBM Plex Sans',sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:'Fraunces', serif; font-weight:700; letter-spacing:-0.01em; }
  .wrap{ max-width:520px; margin:0 auto; padding:0 0 40px; min-height:100vh; }
  .hero{
    background:linear-gradient(120deg, var(--green-900) 0%, var(--green-800) 55%, var(--green-700) 130%);
    color:#fff; padding:26px 20px 22px; position:relative;
  }
  .hero::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold-light) 25%, var(--gold) 50%, var(--gold-light) 75%, transparent); opacity:.6; }
  .hero h1{ font-size:22px; margin:0; }
  .hero p{ font-size:13px; margin:6px 0 0; color:var(--gold-light); }

  main{ padding:18px 16px; }
  .card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid rgba(15,56,48,0.06); padding:16px; margin-bottom:14px; }
  .card h2{ font-size:15px; margin:0 0 12px; }

  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--paper-deep); background:var(--paper); border-radius:11px;
    padding:11px 12px; font-size:14.5px; color:var(--ink); outline:none; font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--green-600); background:#fff; box-shadow:0 0 0 3px rgba(46,125,91,0.15);
  }

  .item-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:10px; }
  .item-row .grow{ flex:1; }
  .item-row .qty{ width:70px; }
  .item-row .rm{ border:none; background:var(--paper-deep); width:38px; height:41px; border-radius:10px; font-size:15px; color:var(--loss); flex:none; }
  .add-item-btn{ background:none; border:1.5px dashed var(--gold); color:var(--gold); border-radius:11px; padding:9px; width:100%; font-size:13px; font-weight:600; }

  /* ---------- Product catalog ---------- */
  .catalog-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pcard{ background:var(--paper); border:1px solid var(--rule); border-radius:13px; overflow:hidden; display:flex; flex-direction:column; }
  .pcard .thumb{ position:relative; width:100%; aspect-ratio:1/1; background:var(--paper-deep); overflow:hidden; }
  .pcard .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pcard .thumb .noimg{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted); }
  .pcard .thumb .play-btn{
    position:absolute; right:6px; bottom:6px; width:26px; height:26px; border-radius:50%;
    background:rgba(15,40,34,0.75); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:11px;
  }
  .pcard .body{ padding:9px 10px 10px; display:flex; flex-direction:column; gap:3px; flex:1; }
  .pcard .pname{ font-size:12.5px; font-weight:600; line-height:1.25; }
  .pcard .pdesc{ font-size:10.5px; color:var(--muted); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pcard .pprice{ font-size:13px; font-weight:700; color:var(--green-700); font-family:'IBM Plex Mono',monospace; margin-top:2px; }
  .pcard .add-btn{ margin-top:6px; border:none; background:linear-gradient(135deg, var(--green-700), var(--green-900)); color:#fff; border-radius:9px; padding:7px; font-size:12px; font-weight:600; }
  .pcard .add-btn.in-cart{ background:var(--gold); color:var(--green-900); }

  /* ---------- Cart summary ---------- */
  .cart-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--rule); }
  .cart-row:last-child{ border-bottom:none; }
  .cart-row .ci-name{ flex:1; font-size:13px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cart-row .ci-price{ font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .stepper{ display:flex; align-items:center; gap:6px; }
  .stepper button{ width:24px; height:24px; border-radius:7px; border:none; background:var(--paper-deep); font-size:14px; }
  .stepper span{ width:20px; text-align:center; font-size:13px; font-weight:600; }
  .cart-rm{ border:none; background:none; color:var(--loss); font-size:15px; }

  /* ---------- Video lightbox ---------- */
  .lightbox-overlay{ position:fixed; inset:0; background:rgba(10,20,17,0.88); z-index:90; display:none; align-items:center; justify-content:center; padding:20px; }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-box{ width:100%; max-width:480px; }
  .lightbox-box iframe, .lightbox-box video{ width:100%; aspect-ratio:16/9; border:none; border-radius:12px; background:#000; }
  .lightbox-close{ display:block; margin:12px auto 0; background:#fff; border:none; border-radius:20px; padding:8px 18px; font-size:13px; font-weight:600; }

  .total-row{ display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,#E7F0EC,#F1F3EC); border-radius:12px; padding:13px 15px; margin-bottom:14px; }
  .total-row .k{ font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .total-row .v{ font-size:20px; font-weight:700; color:var(--green-800); font-family:'IBM Plex Mono',monospace; }

  .btn{ width:100%; padding:14px; border-radius:12px; border:none; font-weight:700; font-size:15px; cursor:pointer; transition:transform .1s ease; }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:linear-gradient(135deg, var(--green-700), var(--green-900)); color:#fff; box-shadow:0 8px 18px rgba(15,56,48,0.28); }
  .btn:disabled{ opacity:.6; }

  .empty-note{ font-size:12.5px; color:var(--muted); text-align:center; padding:10px; }

  #successScreen{ display:none; text-align:center; padding:60px 24px; }
  #successScreen .glyph{ width:64px; height:64px; margin:0 auto 16px; border-radius:20px; background:var(--tint-profit,#E7F0EC); display:flex; align-items:center; justify-content:center; font-size:30px; }
  #successScreen h2{ font-size:19px; }
  #successScreen p{ font-size:13.5px; color:var(--muted); line-height:1.6; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px); z-index:80;
    background:var(--green-900); color:#fff; padding:11px 18px; border-radius:30px; font-size:13px;
    opacity:0; transition:all .25s ease; box-shadow:var(--shadow); white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>

<div class="wrap" id="orderWrap">
  <div class="hero">
    <h1 id="bizName">আপনার দোকান</h1>
    <p>নিচে থেকে পণ্য বেছে অর্ডার করুন — নিশ্চিত করার পর আমরা যোগাযোগ করব</p>
  </div>

  <main>
    <form id="orderForm" onsubmit="return submitOrder(event)">

      <div class="card">
        <h2>আপনার তথ্য</h2>
        <div class="field">
          <label>পূর্ণ নাম *</label>
          <input type="text" id="custName" required placeholder="যেমনঃ করিম উদ্দিন">
        </div>
        <div class="field">
          <label>মোবাইল নম্বর *</label>
          <input type="tel" id="custPhone" required placeholder="01XXXXXXXXX">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>সম্পূর্ণ ঠিকানা *</label>
          <textarea id="custAddress" rows="2" required placeholder="বাসা/রোড, এলাকা, থানা, জেলা"></textarea>
        </div>
      </div>

      <div class="card">
        <h2>পণ্য দেখুন ও যোগ করুন</h2>
        <div class="catalog-grid" id="catalogGrid"></div>
      </div>

      <div class="card" id="cartCard" style="display:none;">
        <h2>আপনার অর্ডার</h2>
        <div id="cartBox"></div>
      </div>

      <div class="card">
        <h2>পেমেন্ট পদ্ধতি ও নোট</h2>
        <div class="field">
          <label>পেমেন্ট পদ্ধতি *</label>
          <select id="custPayment" required>
            <option value="Cash on Delivery">ক্যাশ অন ডেলিভারি</option>
            <option value="bKash">বিকাশ</option>
            <option value="Nagad">নগদ</option>
            <option value="Rocket">রকেট</option>
            <option value="Bank Transfer">ব্যাংক ট্রান্সফার</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>বিশেষ নোট (ঐচ্ছিক)</label>
          <textarea id="custNotes" rows="2" placeholder="কোনো বিশেষ নির্দেশনা থাকলে লিখুন"></textarea>
        </div>
      </div>

      <div class="total-row">
        <span class="k">সর্বমোট</span>
        <span class="v" id="totalDisplay">৳0.00</span>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">অর্ডার নিশ্চিত করুন</button>
    </form>
  </main>

  <div id="successScreen">
    <div class="glyph">✅</div>
    <h2>অর্ডার সম্পন্ন হয়েছে!</h2>
    <p>আপনার অর্ডারটি আমরা পেয়েছি। শীঘ্রই আমরা আপনার সাথে যোগাযোগ করব।</p>
    <button class="btn btn-primary" style="margin-top:18px;" onclick="location.reload()">আরেকটি অর্ডার করুন</button>
  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="if(event.target===this) closeLightbox()">
  <div class="lightbox-box">
    <div id="lightboxContent"></div>
    <button type="button" class="lightbox-close" onclick="closeLightbox()">বন্ধ করুন</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURE THIS SECTION FOR YOUR BUSINESS
   ========================================================= */
const BUSINESS_NAME = "আপনার দোকানের নাম"; // TODO: এখানে দোকানের নাম দিন
const FIREBASE_CONFIG = {
  // TODO: Firebase কনসোল থেকে কপি করা আপনার config এখানে পেস্ট করুন
  // ঠিক একই config যা আপনি Khatabook অ্যাপের Settings > Live Order Sync-এ দিয়েছেন
  apiKey: "AIzaSyCJOhYaGVS3OlMdpwHAYtNTnkc4cLNWlIU",
  authDomain: "sohanshopbd.firebaseapp.com",
  databaseURL: "https://sohanshopbd-default-rtdb.firebaseio.com",
  projectId: "sohanshopbd",
  storageBucket: "sohanshopbd.firebasestorage.app",
  messagingSenderId: "375490913858",
  appId: "1:375490913858:web:3596b25f007cc10be1efdb"
};
/* ========================================================= */

document.getElementById('bizName').textContent = BUSINESS_NAME;

let products = [];
let cart = {}; // productId -> { productId, name, price, qty }

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

db.ref('products').on('value', snap => {
  const val = snap.val() || {};
  products = Object.keys(val).map(id => Object.assign({ id }, val[id]));
  renderCatalog();
});

function renderCatalog(){
  const grid = document.getElementById('catalogGrid');
  if(products.length === 0){
    grid.innerHTML = '<div class="empty-note" style="grid-column:1/-1;">এই মুহূর্তে কোনো পণ্য যোগ করা হয়নি। দোকানদারকে জানান।</div>';
    document.getElementById('submitBtn').disabled = true;
    return;
  }
  document.getElementById('submitBtn').disabled = false;
  grid.innerHTML = products.map(p => {
    const inCartQty = cart[p.id] ? cart[p.id].qty : 0;
    return `
    <div class="pcard">
      <div class="thumb">
        ${p.imageUrl
          ? `<img src="${escapeHTML(p.imageUrl)}" alt="${escapeHTML(p.name)}" onerror="this.parentElement.innerHTML='<div class=noimg>🛍️</div>'">`
          : `<div class="noimg">🛍️</div>`}
        ${p.videoUrl ? `<button type="button" class="play-btn" onclick="playVideo('${escapeHTML(p.videoUrl)}')" aria-label="ভিডিও দেখুন">▶</button>` : ''}
      </div>
      <div class="body">
        <div class="pname">${escapeHTML(p.name)}</div>
        ${p.description ? `<div class="pdesc">${escapeHTML(p.description)}</div>` : ''}
        <div class="pprice">৳${Number(p.price).toFixed(2)}</div>
        <button type="button" class="add-btn ${inCartQty ? 'in-cart' : ''}" onclick="addToCart('${p.id}')">
          ${inCartQty ? `কার্টে ${inCartQty}টি · আরও যোগ করুন` : 'যোগ করুন'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function addToCart(productId){
  const p = products.find(x => x.id === productId);
  if(!p) return;
  if(cart[productId]){
    cart[productId].qty += 1;
  } else {
    cart[productId] = { productId: p.id, name: p.name, price: Number(p.price) || 0, qty: 1 };
  }
  renderCatalog();
  renderCart();
}
function changeQty(productId, delta){
  if(!cart[productId]) return;
  cart[productId].qty += delta;
  if(cart[productId].qty <= 0) delete cart[productId];
  renderCatalog();
  renderCart();
}
function removeFromCart(productId){
  delete cart[productId];
  renderCatalog();
  renderCart();
}
function renderCart(){
  const items = Object.values(cart);
  const cartCard = document.getElementById('cartCard');
  const box = document.getElementById('cartBox');
  if(items.length === 0){
    cartCard.style.display = 'none';
    updateTotal();
    return;
  }
  cartCard.style.display = 'block';
  box.innerHTML = items.map(it => `
    <div class="cart-row">
      <div class="ci-name">${escapeHTML(it.name)}<br><span class="ci-price">৳${it.price.toFixed(2)} × ${it.qty}</span></div>
      <div class="stepper">
        <button type="button" onclick="changeQty('${it.productId}', -1)">−</button>
        <span>${it.qty}</span>
        <button type="button" onclick="changeQty('${it.productId}', 1)">+</button>
      </div>
      <button type="button" class="cart-rm" onclick="removeFromCart('${it.productId}')">✕</button>
    </div>`).join('');
  updateTotal();
}
function collectItems(){
  return Object.values(cart);
}
function updateTotal(){
  const items = collectItems();
  const total = items.reduce((s,it) => s + it.price * it.qty, 0);
  document.getElementById('totalDisplay').textContent = '৳' + total.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- VIDEO LIGHTBOX ---------------- */
function getYouTubeEmbed(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}
function playVideo(url){
  const content = document.getElementById('lightboxContent');
  const ytEmbed = getYouTubeEmbed(url);
  if(ytEmbed){
    content.innerHTML = `<iframe src="${ytEmbed}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  } else if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)){
    content.innerHTML = `<video src="${escapeHTML(url)}" controls autoplay playsinline></video>`;
  } else {
    content.innerHTML = `<div style="background:#fff; border-radius:12px; padding:24px; text-align:center;">
      <p style="font-size:13.5px; margin-bottom:14px;">এই ভিডিওটি সরাসরি এখানে দেখানো যাচ্ছে না।</p>
      <a href="${escapeHTML(url)}" target="_blank" rel="noopener" class="btn btn-primary" style="display:inline-block; width:auto; padding:10px 20px;">ভিডিও দেখুন</a>
    </div>`;
  }
  document.getElementById('lightboxOverlay').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.getElementById('lightboxContent').innerHTML = '';
}

function submitOrder(e){
  e.preventDefault();
  const items = collectItems();
  if(items.length === 0){ showToast('অন্তত একটি পণ্য নির্বাচন করুন'); return false; }
  const total = items.reduce((s,it) => s + it.price * it.qty, 0);
  const order = {
    customerName: document.getElementById('custName').value.trim(),
    phone: document.getElementById('custPhone').value.trim(),
    address: document.getElementById('custAddress').value.trim(),
    paymentMethod: document.getElementById('custPayment').value,
    notes: document.getElementById('custNotes').value.trim(),
    items,
    total,
    status: 'pending',
    createdAt: Date.now()
  };
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'পাঠানো হচ্ছে…';
  db.ref('orders').push(order)
    .then(()=>{
      document.getElementById('orderWrap').querySelector('main').style.display = 'none';
      document.querySelector('.hero').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
    })
    .catch(err => {
      showToast('অর্ডার পাঠাতে সমস্যা হয়েছে, আবার চেষ্টা করুন');
      btn.disabled = false;
      btn.textContent = 'অর্ডার নিশ্চিত করুন';
    });
  return false;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}
</script>
</body>
</html>
